# Sensor poses in the VEHICLE frame (see fusion/transforms.py).
#   Vehicle frame: origin = MTi-8 IMU center, x forward, y left, z up.
#   translation_m: sensor origin in vehicle axes, metres.
#   rpy_deg: optional mount tilt [roll, pitch, yaw] about vehicle x/y/z,
#            applied on top of the sensor's nominal axis mapping.
#   measured: false => placeholder, replace after measuring the rig.
#
# TODO: measure every translation below from the IMU center (ruler/calipers;
# see calibration/rig_measurements.md). Only the radar<->camera relative
# offset is real (from config.settings.RADAR_TO_CAMERA_OFFSET_M); the
# absolute positions are placeholders.
sensors:
  imu:
    translation_m: [0.0, 0.0, 0.0]
    measured: true            # origin by definition
  camera:                     # ZED 2 LEFT lens optical center
    translation_m: [0.0, 0.0, 0.0]      # TODO measure
    rpy_deg: [0.0, 0.0, 0.0]            # TODO mount tilt (Kalibr T_cam_imu)
    measured: false
  radar:                      # AWR1843 antenna array phase center
    # = camera + (-0.004, -0.055, +0.015): radar sits 5.5 cm to the camera's
    # right (vehicle -y), 1.5 cm above, 0.4 cm behind (RADAR_TO_CAMERA_OFFSET_M).
    translation_m: [-0.004, -0.055, 0.015]   # relative to camera placeholder
    rpy_deg: [0.0, 0.0, 0.0]
    measured: false
  lidar:                      # Ouster OS-0-64 sensor frame origin
    translation_m: [0.0, 0.0, 0.0]      # TODO measure
    rpy_deg: [0.0, 0.0, 0.0]
    measured: false
  gnss:                       # antenna phase center
    translation_m: [0.0, 0.0, 0.0]      # TODO measure
    measured: false
